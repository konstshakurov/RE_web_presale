# TLS-конфиг nginx для боевого деплоя (KON-49/KON-108).
# Монтируется в контейнер proxy поверх base nginx.conf.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 443 ssl;
    server_name vm-re.simbirsoft vm-re 10.73.11.110;
    server_tokens off;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS НЕ включаем: сертификат самоподписанный (см. отчёт).
    # Включить позже после перехода на внутренний УЦ:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 12m;

    set $api_upstream http://api:8000;
    set $api_health   http://api:8000/health;
    set $web_upstream http://web:8080;

    location = /health {
        proxy_pass $api_health;
    }
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
    }
}
