# Docker DNS пересоздаёт IP контейнеров api/web при `up -d --build`: nginx должен
# перерезолвить имя, поэтому upstream задан через переменную (KON-65).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;   # лимит файла CV 10 МБ + запас (допущение A5)
    server_tokens off;

    set $api_upstream http://api:8000;
    set $api_health   http://api:8000/health;
    set $web_upstream http://web:8080;

    location = /health {
        # переменная с URI: запрос уходит ровно на /health
        proxy_pass $api_health;
    }
    location /api/ {
        # с переменной в proxy_pass префикс не срезается автоматически: убираем /api/ вручную,
        # query string сохраняется
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
    }
}
