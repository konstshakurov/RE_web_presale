.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;vertical-align:-2px;margin-right:6px}

function bind(){
  var $=function(s){return document.querySelector(s)};
  document.querySelectorAll('[data-st]').forEach(function(b){
    if(b.type==='checkbox')b.addEventListener('change',function(){var s=b.dataset.st,i=state.st.indexOf(s);if(i>-1)state.st.splice(i,1);else state.st.push(s);var o=state.open;render();});
    else b.addEventListener('click',function(){setst(b.dataset.st)})});
  document.querySelectorAll('[data-rm]').forEach(function(b){b.addEventListener('click',function(){setst(b.dataset.rm)})});
  var a=$('#all');if(a)a.addEventListener('click',function(){state.st=[];render()});
  var r=$('#ro');if(r)r.addEventListener('change',function(){state.ro=r.value;render()});
  var qq=$('#q');if(qq)qq.addEventListener('input',function(){state.q=qq.value;var p=qq.selectionStart;render();var n=$('#q');n.focus();n.setSelectionRange(p,p)});
  var f=$('#fired');if(f)f.addEventListener('change',function(){state.fired=f.checked;render()});
  ['#reset','#reset2'].forEach(function(s){var x=$(s);if(x)x.addEventListener('click',function(){state.open=false;reset()})});
  var m=$('#msb');if(m)m.addEventListener('click',function(){state.open=!state.open;render();if(state.open){var c=document.querySelector('.ms__opt input');if(c)c.focus()}});
  var cp=$('#closepop');if(cp)cp.addEventListener('click',function(){state.open=false;render();$('#msb').focus()});
  var cl=$('[data-clrst]');if(cl)cl.addEventListener('click',function(){state.st=[];render()});
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&state.open){state.open=false;render();var m=document.getElementById('msb');if(m)m.focus()}});
document.addEventListener('mousedown',function(e){if(state.open&&!e.target.closest('.ms')){state.open=false;render()}});

document.querySelectorAll('[data-p]').forEach(function(a){var p=new URLSearchParams(location.search);a.dataset.p.split('&').forEach(function(kv){var s=kv.split('=');p.set(s[0],s[1])});a.href='?'+p.toString()});
