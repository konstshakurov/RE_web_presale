<!doctype html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KON-115 - на месте, в ячейке</title><style>
:root,:root[data-theme=dark]{--bg:#12171d;--panel:#1b222b;--panel-2:#232c37;--text:#e4e7eb;--muted:#9aa5b1;--border:#323f4b;--accent:#3e8ef7;--nav:#0f1b33;--err:#ff8a80;--ok:#34c38f;--warn:#f5b041;--primary:#2870d4;--primary-hover:#235fc0;--nav-text:#cbd2d9;color-scheme:dark}
:root[data-theme=light]{--bg:#f4f6f8;--panel:#fff;--panel-2:#eef1f4;--text:#1f2933;--muted:#616e7c;--border:#cbd2d9;--accent:#1f6fd6;--nav:#1f2933;--err:#b42318;--ok:#1a7f5a;--warn:#b7791f;--primary:#1f6fd6;--primary-hover:#1a5bb8;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;color:var(--text);background:var(--bg)}
a{color:var(--accent)}
.harness{position:sticky;top:0;z-index:70;background:#000;color:#ddd;font:12px system-ui;padding:6px 12px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.harness b{color:#fff}.harness label{display:flex;gap:4px;align-items:center}
.harness select{background:#222;color:#fff;border:1px solid #555;border-radius:3px;padding:2px 6px;font:12px system-ui}
.nohar .harness{display:none}
.tb{display:flex;align-items:flex-end;gap:20px;padding:0 24px;height:56px;background:var(--nav);color:#fff}
.tb__brand{align-self:center;font-weight:700;letter-spacing:.5px;color:#fff;margin-right:8px}
.tb__nav{display:flex;gap:2px;flex:1;align-self:flex-end}
.tb__nav a{color:var(--nav-text);text-decoration:none;padding:12px 16px;border-radius:6px 6px 0 0;margin-top:8px}
.tb__nav a.active{background:var(--bg);color:var(--text);font-weight:600}
.tb__user{align-self:center;color:#fff}
.content{padding:24px;overflow-x:auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 24px;flex-wrap:wrap;margin:0 0 4px}
.page-head h1{margin:21px 0 12px}
.muted{color:var(--muted);margin:4px 0}
.error{color:var(--err);margin:0}
.needs{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);table-layout:fixed;min-width:950px}
.needs th{text-align:left;background:var(--panel-2);padding:10px 12px;font-size:calc(1em - 2px)}
.needs td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:top;overflow-wrap:anywhere}
.needs tr.is-editing td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.status{color:var(--ok);background:var(--panel-2);border-radius:4px;padding:2px 8px;white-space:nowrap}
.emp__chip{margin-top:6px}
.file__kind,.file__meta{font-size:13px}
.file__name{display:block}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 0;font:inherit;font-size:13px;text-decoration:none}
.link--danger{color:var(--err)}
.file__actions{display:flex;gap:12px}
.note{white-space:pre-wrap;overflow-wrap:anywhere}
.flash{color:var(--ok);font-size:13px;margin:4px 0}
button.act{background:transparent;border:0;border-radius:4px;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 8px;line-height:1.2;white-space:nowrap}
.note-cell button.act{margin-left:-8px}
button.act:hover{color:var(--text)}
button.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px;color:var(--text)}
button.act:active{color:var(--text);background:var(--panel-2)}
button.act:disabled{opacity:.5;cursor:default;background:transparent;color:var(--muted)}
.ned{display:flex;flex-direction:column;gap:8px}
.ned__lbl{font-weight:600}
.ned textarea{width:100%;background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:8px;font:inherit;line-height:1.4;resize:vertical;display:block}
.ned textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.ned textarea[readonly]{opacity:.7}
.ned textarea.is-over{border-color:var(--err)}
.ned__row{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.ned__cnt{white-space:nowrap;font-variant-numeric:tabular-nums}
.ned__cnt.is-warn{color:var(--text);font-weight:600}.ned__cnt.is-over{color:var(--err);font-weight:600}
.ned__hint{min-width:0}
.ned__msg{font-size:13px;margin:0}
.ned__act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ned__sp{flex:1}
.btn{background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:6px 12px;font:inherit;cursor:pointer}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.pm__x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn--text{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
.btn--text:hover:not(:disabled){color:var(--text)}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:sp .9s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.ned__st{font-size:13px;color:var(--muted)}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.bd[hidden]{display:none}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:6px;display:flex;flex-direction:column;overflow:hidden;max-height:100%;width:min(560px,100%)}
.pm__head{flex:none;padding:16px 24px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start}
.pm__t{flex:1;min-width:0}
.pm__head h2{margin:0;font-size:18px;line-height:1.3;overflow-wrap:anywhere}
.pm__meta{margin-top:6px;font-size:13px;color:var(--muted)}
.pm__x{flex:none;background:transparent;border:0;color:var(--muted);width:32px;height:32px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;margin:-4px -8px 0 0}
.pm__x:hover:not(:disabled){color:var(--text);background:var(--panel-2)}
.pm__x:disabled{opacity:.5;cursor:default}
.pm__body{flex:1 1 auto;min-height:0;overflow:auto;padding:16px 24px}
.pm__foot{flex:none;display:flex;gap:8px;align-items:center;padding:12px 24px;border-top:1px solid var(--border);background:var(--panel)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.35)}
.bd.bd--side{justify-content:flex-end;align-items:stretch;padding:0;background:rgba(0,0,0,.35)}
.drawer .pm__body{display:flex;flex-direction:column;gap:16px}
.ctx{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:14px;margin:0}
.ctx dt{color:var(--muted)}.ctx dd{margin:0;overflow-wrap:anywhere}
.drawer .ned{flex:1;min-height:0}
.drawer .ned textarea{flex:1;min-height:200px;resize:none}
.modal .ned textarea{min-height:220px}
.note-cell .ned textarea{min-height:120px}</style></head><body>
<div class="harness"><b>KON-115 - вариант A: на месте, в ячейке (proposed)</b>
<label>Тема <select onchange="document.documentElement.dataset.theme=this.value"><option value="dark">тёмная</option><option value="light">светлая</option></select></label>
<label>Ответ сервера при сохранении <select id="mode"><option value="ok">успех</option><option value="503">ошибка 503</option><option value="404">ошибка 404</option><option value="hang">без ответа (идёт сохранение)</option></select></label>
<span>Нажмите «Изменить» в любой строке. Ctrl+Enter - сохранить, Esc - отмена. Автор в макете - логин из сессии (ivanova). Шапка упрощена.</span></div>
<header class="tb"><span class="tb__brand">regoose</span><nav class="tb__nav" aria-label="Разделы"><a href="#">Потребности</a><a href="#">Сотрудники</a><a href="#" class="active">Резюме</a><a href="#">Настройки</a></nav><span class="tb__user">Анастасия Иванова</span></header>
<main class="content"><section><div class="page-head"><h1>Резюме</h1></div>
<table class="needs"><colgroup><col style="width:21%"><col style="width:22%"><col style="width:33%"><col style="width:24%"></colgroup><thead><tr><th>Сотрудник</th><th>Файлы</th><th>Описание</th><th>Заметка</th></tr></thead><tbody id="tb"></tbody></table></section></main>

<script>
const LIMIT=2000, NOW='21.10.26, 11:20', ME='ivanova';
const LONG=('Вернётся из отпуска 20.10. Подключить к проекту по интеграции учётных систем, согласовать участие с руководителем направления; ограничение: без командировок в ноябре. Контакт для согласования — руководитель практики.\n\nПожелания: backend-задачи, без поддержки легаси. Английский — рабочий, участие в звонках с клиентом возможно после согласования. ').repeat(2).trim();
const ROWS=[
 {name:'Иванов Пётр Андреевич',st:'Свободен',desc:'интеграции, rest, sql',note:'Готов к командировкам',author:'ivanova',at:'10.10.26, 12:05',files:1},
 {name:'Сидорова Елена Викторовна',st:'Коммерческий проект',desc:'—',note:'',author:'',at:'',files:0},
 {name:'Козлов Павел Дмитриевич',st:'Скоро освобождается',desc:'sql, bpmn, uml',note:'',author:'',at:'',files:1},
 {name:'Орлова Мария Игоревна',st:'Отпуск',desc:'—',note:LONG,author:'petrov',at:'09.10.26, 11:40',files:0}
];
const PENCIL='<svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function plural(n,a,b,c){const m=n%100,d=n%10;return (m>10&&m<20)?c:d===1?a:(d>1&&d<5)?b:c}
let cur=null, editing=-1, PRESET=false;

function filesCell(r){return r.files?'<span class="file__kind">Основное CV</span> <span class="file__name">'+esc(r.name.split(' ')[0])+'_CV.docx</span><div class="muted file__meta">10.10.2026, 12:00</div><div class="file__actions"><a href="#" class="link">Скачать</a><button type="button" class="link">Просмотр</button><button type="button" class="link link--danger">Удалить</button></div>':'<p class="muted" style="margin:0 0 4px">нет основного CV</p>'}
function noteCell(i){
  const r=ROWS[i], dis=(editing>=0&&!MODAL)?' disabled':'';
  const body=r.note?'<div class="note">'+esc(r.note)+'</div><div class="muted">'+esc(r.author)+', '+esc(r.at)+'</div>':'<span class="muted">нет заметки</span>';
  const fl=r.flash?'<div class="flash" role="status">'+r.flash+'</div>':'';
  return body+fl+'<br><button type="button" class="act" data-edit="'+i+'"'+dis+' aria-label="Изменить заметку: '+esc(r.name)+'">'+PENCIL+'<span>Изменить</span></button>';
}
function renderTable(){
  $('#tb').innerHTML=ROWS.map((r,i)=>'<tr data-r="'+i+'"'+(editing===i?' class="is-editing"':'')+'><td><a href="#">'+esc(r.name)+'</a><div class="emp__chip"><span class="status">'+esc(r.st)+'</span></div></td><td>'+filesCell(r)+'</td><td>'+(r.desc==='—'?'<span class="muted">—</span>':esc(r.desc))+'</td><td class="note-cell" id="ncell'+i+'">'+((INLINE&&editing===i)?'':noteCell(i))+'</td></tr>').join('');
  if(INLINE&&editing>=0){mountEditor($('#ncell'+editing),editing)}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-edit]');if(b&&!b.disabled)openEditor(+b.dataset.edit)});

function mountEditor(host,i){
  const o=OPTS, r=ROWS[i];
  host.innerHTML='<div class="ned">'+
   (o.label?'<label class="ned__lbl" for="nt">Заметка</label>':'')+
   '<textarea id="nt" rows="'+o.rows+'" placeholder="Например: ограничения по проектам или командировкам" '+(o.label?'':'aria-label="Заметка: '+esc(r.name)+'" ')+'aria-describedby="nh ncnt"></textarea>'+
   (o.inline?'<div class="ned__row"><button type="button" class="btn btn--text" data-a="clear">Очистить</button><span class="ned__cnt" id="ncnt" aria-live="polite"></span></div><div class="ned__hint" id="nh"></div>':'<div class="ned__row"><span class="ned__hint" id="nh"></span><span class="ned__cnt" id="ncnt" aria-live="polite"></span></div>')+
   '<p class="ned__msg error" id="nerr" role="alert" hidden></p>'+
   (o.foot?'':'<div class="ned__act">'+actions()+'</div>')+'</div>';
  const t=$('#nt',host);t.value=cur.text;t.addEventListener('input',()=>{cur.text=t.value;cur.err='';upd()});
  t.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();save()}});
  upd();
}
function actions(){return '<button type="button" class="btn primary" data-a="save">Сохранить</button><button type="button" class="btn" data-a="cancel">Отмена</button><span class="ned__st" id="nst" role="status"></span>'}
function upd(){
  const r=ROWS[cur.i], n=cur.text.length, over=n>LIMIT, saving=cur.busy;
  const c=$('#ncnt');c.textContent=n+' / '+LIMIT;c.className='ned__cnt'+(over?' is-over':n>=1900?' is-warn':'');
  const h=$('#nh');h.textContent=over?'Сократите текст на '+(n-LIMIT)+' '+plural(n-LIMIT,'знак','знака','знаков'):(OPTS.inline?'':'Учитывается при сопоставлении с потребностью');
  h.style.color=over?'var(--err)':'';
  const t=$('#nt');t.classList.toggle('is-over',over);t.readOnly=saving;
  const e=$('#nerr');e.hidden=!cur.err;e.textContent=cur.err||'';
  const changed=cur.text!==r.note, clearing=cur.text===''&&r.note!=='';
  document.querySelectorAll('[data-a=save]').forEach(b=>{b.disabled=saving||over||!changed;b.textContent=clearing?'Очистить заметку':'Сохранить';b.classList.toggle('danger',clearing);b.classList.toggle('primary',!clearing)});
  document.querySelectorAll('[data-a=cancel]').forEach(b=>b.disabled=saving);
  document.querySelectorAll('[data-a=clear]').forEach(b=>{b.disabled=saving||cur.text===''});
  document.querySelectorAll('#nst').forEach(s=>s.innerHTML=saving?'<span class="spinner"></span>Сохраняем…':'');
}
function mode(){return $('#mode')?$('#mode').value:'ok'}
function save(){
  if(!cur||cur.busy)return;const n=cur.text.length;if(n>LIMIT||cur.text===ROWS[cur.i].note)return;
  cur.busy=true;cur.err='';upd();
  if(mode()==='hang')return;
  setTimeout(()=>{
    const m=mode();
    if(m==='503'){cur.busy=false;cur.err='Сервис временно недоступен, повторите позже';upd();$('#nt').focus();return}
    if(m==='404'){cur.busy=false;cur.err='Сотрудник не найден';upd();$('#nt').focus();return}
    const r=ROWS[cur.i], clr=cur.text==='';
    r.note=cur.text;r.author=clr?'':ME;r.at=clr?'':NOW;r.flash=clr?'Заметка очищена':'Сохранено';
    const i=cur.i;closeEditor();
    setTimeout(()=>{r.flash='';if(editing<0)renderTable()},4000);
  },700);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a;if(a==='save')save();
  if(a==='cancel')closeEditor();
  if(a==='clear'){cur.text='';const t=$('#nt');t.value='';cur.err='';upd();t.focus()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&cur&&!cur.busy)closeEditor()});
function openEditor(i,text){
  if(cur)return;
  cur={i:i,text:text!=null?text:ROWS[i].note,busy:false,err:''};editing=i;ROWS[i].flash='';
  UI.open(i);const t=$('#nt');if(t&&!PRESET){t.focus();t.setSelectionRange(t.value.length,t.value.length)}
}
function closeEditor(){
  const i=cur.i;UI.close(i);cur=null;editing=-1;renderTable();
  const b=$('[data-edit="'+i+'"]');if(b&&!PRESET)b.focus();
}
function rep(s,n){let o='';while(o.length<n)o+=s;return o.slice(0,n)}
function preset(){
  const q=new URLSearchParams(location.hash.slice(1));
  if(q.get('t'))document.documentElement.dataset.theme=q.get('t');
  if(q.get('h')==='0')document.body.classList.add('nohar');
  const s=q.get('s');if(!s)return;PRESET=true;
  const sent='Готов к командировкам, работает с интеграциями и отчётностью. ';
  const edit='Готов к командировкам. Не подключать к проектам клиента Бета до согласования.';
  if(s==='edit')openEditor(0,edit);
  if(s==='empty')openEditor(1,'');
  if(s==='long')openEditor(3);
  if(s==='limit')openEditor(0,rep(sent,1962));
  if(s==='over')openEditor(0,rep(sent,2134));
  if(s==='clear')openEditor(0,'');
  if(s==='saving'){$('#mode').value='hang';openEditor(0,edit);save()}
  if(s==='error'){openEditor(0,edit);cur.err='Сервис временно недоступен, повторите позже';upd()}
  if(s==='saved'){const r=ROWS[0];r.note=edit;r.author=ME;r.at=NOW;r.flash='Сохранено';renderTable()}
  if(s==='cleared'){const r=ROWS[0];r.note='';r.author='';r.at='';r.flash='Заметка очищена';renderTable()}
}


const INLINE=true, MODAL=false, OPTS={label:false,rows:6,inline:true};
const UI={open(i){renderTable()},close(i){}};

renderTable();preset();
</script></body></html>
