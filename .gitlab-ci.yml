# Заготовка для переноса в корпоративный GitLab (KON-32). Не проверена на GitLab Runner.
# Зеркалит .github/workflows/ci.yml. Для db-isolation/images нужен runner с Docker (dind или shell).
stages: [lint_test, build, verify]

backend:
  stage: lint_test
  image: python:3.12-slim
  tags: [docker]
  script:
    - cd backend
    # git нужен тесту NFR-006 (qa/nfr006_check.py вызывает git ls-files)
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - pip install -r requirements-dev.txt
    - ruff check .
    - pytest

frontend:
  stage: lint_test
  image: node:22-alpine
  tags: [docker]
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm test
    - npm run build

secrets:
  stage: lint_test
  # Debian (GNU grep): busybox grep в alpine не поддерживает флаги скрипта (-I)
  image: debian:bookworm-slim
  tags: [docker]
  before_script: [apt-get update -qq, apt-get install -y -qq --no-install-recommends bash git grep findutils ca-certificates]
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - bash scripts/check_secrets.sh

images:
  stage: build
  image: docker:27
  tags: [docker]
  services: [docker:27-dind]
  # контекст backend - корень репозитория (Dockerfile тянет src/jira_client)
  script:
    - docker build -f backend/Dockerfile -t re_web_presale-backend .
    - docker build -t re_web_presale-frontend ./frontend

db-isolation:
  stage: verify
  image: docker:27
  tags: [docker]
  services: [docker:27-dind]
  before_script: [apk add --no-cache bash openssl docker-cli-compose]
  script:
    - |
      {
        echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
        echo "APP_RW_PASSWORD=$(openssl rand -hex 16)"
        echo "CV_RW_PASSWORD=$(openssl rand -hex 16)"
        # ldap-test объявляет эти переменные обязательными (docker compose.yml:140); значения
        # тестовые, изолированный сервис в задаче не используется
        echo "TEST_LDAP_DOMAIN=example.test"
        echo "TEST_LDAP_ADMIN_PASSWORD=$(openssl rand -hex 16)"
        echo "APP_DB_URL=x"; echo "CV_DB_URL=x"; echo "APP_ENC_KEY=x"
      } > .env
    # volume от прежнего прогона держит пароли ролей из первой инициализации - в CI
    # пароль каждый раз новый, поэтому окружение полностью одноразовое (down -v)
    - docker compose down -v --remove-orphans || true
    - docker compose up -d --wait db
    - bash scripts/check_db_isolation.sh
